<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POST TITLE - Road to Million</title>
<meta name="description" content="A post from Road to Million.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--paper:#e6ebf1;--paper-deep:#d6dee7;--ink:#16233a;--ink-soft:#54637c;--rule:#a9b8ca;--signal:#c8471f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--paper);
background-image:linear-gradient(var(--paper-deep) 1px, transparent 1px),linear-gradient(90deg, var(--paper-deep) 1px, transparent 1px);
background-size:44px 44px;
color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
a{color:inherit}
header{border-bottom:1px solid var(--rule);background:rgba(255,255,255,.5)}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;flex-wrap:wrap;max-width:720px;margin:0 auto;padding-left:24px;padding-right:24px}
.mark{font-family:"Archivo",sans-serif;font-weight:800;letter-spacing:-.02em;font-size:17px}
.mark span{color:var(--signal)}
nav a{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft)}
nav a:hover{color:var(--signal)}
main{padding:56px 0 80px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:clamp(30px,6vw,48px);letter-spacing:-.03em;margin:10px 0 34px;line-height:1.1}
.post-body p{margin-bottom:18px;color:var(--ink-soft);font-size:17px}
footer{border-top:1px solid var(--rule);padding:30px 0;margin-top:20px}
.foot{max-width:720px;margin:0 auto;padding:0 24px}
.foot a{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft)}
.foot a:hover{color:var(--signal)}
</style>
</head>
<body>

<header>
<div class="masthead">
<div class="mark">ROAD TO <span>MILLION</span></div>
<nav><a href="../index.html">Back to frontpage</a></nav>
</div>
</header>

<main class="wrap">
<!-- ===========================================================
EDIT THIS PART FOR EACH NEW POST:
1. Change the date below.
2. Change the h1 title.
3. Replace the paragraphs inside .post-body with your text,
one <p>...</p> per paragraph.
4. Save this file as blog/YYYY-MM-DD-your-slug.html
5. Add a matching entry to the "posts" array in index.html:
{ date: "YYYY-MM-DD", title: "Your title",
link: "blog/YYYY-MM-DD-your-slug.html" }
=========================================================== -->
<div class="eyebrow">17 Aug 2026</div>
<h1>Your post title goes here</h1>
<div class="post-body">
<p>Write your first paragraph here.</p>
<p>Add as many paragraphs as you like.</p>
</div>
</main>

<footer>
<div class="foot"><a href="../index.html">Back to frontpage</a></div>
</footer>

</body>
</html>
